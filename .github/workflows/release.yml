# Project Chronos - release pipeline.
#
# Triggers:
#   * push of a tag matching v*  (e.g. git tag v0.2.0 && git push origin v0.2.0)
#   * workflow_dispatch with an explicit version input (no tag required)
#
# Assets built from source and attached to the GitHub Release:
#   * chronos-<ver>-linux-amd64.deb              desktop app (Wails/WebKit)
#   * chronos-<ver>-linux-amd64.tar.gz           portable desktop bundle
#   * chronos-<ver>-linux-amd64-web.tar.gz       browser mode (headless CLI + web/)
#   * chronos-<ver>-windows-amd64.zip            desktop exe + chronos-cli.exe + web/
#   * SHA256SUMS                                 combined checksums

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (e.g. 0.1.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CGO_ENABLED: "1"

jobs:
  meta:
    name: resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve version from tag or dispatch input
        id: resolve
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION}" ]; then
            VERSION="${INPUT_VERSION#v}"
          else
            VERSION="${REF_NAME#v}"
          fi
          VERSION="$(printf '%s' "${VERSION}" | tr -d '[:space:]')"
          if [ -z "${VERSION}" ]; then
            echo "::error::Could not resolve a version (empty tag/input)."
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Releasing Chronos ${VERSION}"

  build-linux:
    name: build-linux (wails + .deb + .tar.gz)
    runs-on: ubuntu-latest
    needs: meta
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      LD_LIBRARY_PATH: ${{ github.workspace }}/native/build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ pkg-config \
            libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        shell: bash
        run: |
          set -euo pipefail
          # Pin to the go.mod version; @latest could resolve to Wails v3 and
          # change the build flags silently.
          WAILS_VERSION="$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)"
          go install "github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}"
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"

      - name: Build native library
        shell: bash
        run: |
          set -euo pipefail
          cmake -S native -B native/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCHRONOS_BUILD_TESTS=OFF
          cmake --build native/build --parallel

      - name: Frontend dependencies
        shell: bash
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: wails build
        shell: bash
        run: |
          set -euo pipefail
          wails build -clean -tags "webkit2_41 chronos_native" \
            -ldflags "-X main.version=${VERSION}"

      # Browser-mode CLI (no Wails/GTK). Built after the frontend build so its
      # assets exist for the web tarball (web/) and for `serve`.
      - name: Build browser-mode CLI
        shell: bash
        run: |
          set -euo pipefail
          CGO_ENABLED=1 go build -tags chronos_native -o build/bin/chronos-cli ./cmd/chronos
          ls -l build/bin/chronos-cli

      - name: Fetch ONNX Runtime CPU runtime
        shell: bash
        run: |
          set -euo pipefail
          ORT_VERSION=1.24.4
          ORT_DIR="${RUNNER_TEMP}/ort"
          mkdir -p "${ORT_DIR}"
          curl -Lf --retry 3 --retry-delay 2 -o "${ORT_DIR}/ort.tgz" \
            "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-linux-x64-${ORT_VERSION}.tgz"
          tar -xzf "${ORT_DIR}/ort.tgz" -C "${ORT_DIR}" --strip-components=1
          cp -L "${ORT_DIR}/lib/libonnxruntime.so" "${ORT_DIR}/libonnxruntime.so"
          echo "ORT_LIB=${ORT_DIR}/libonnxruntime.so" >> "${GITHUB_ENV}"
          ls -l "${ORT_DIR}/libonnxruntime.so"

      - name: Package web tarball + .deb + .tar.gz
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-packages
          VERSION="${VERSION}" OUT_DIR=dist-packages WEB_BIN=build/bin/chronos-cli \
            DIST_DIR=frontend/dist ORT_LIB="${ORT_LIB}" bash scripts/package-linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: chronos-linux
          path: dist-packages/*
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: build-windows (wails + .zip)
    runs-on: windows-latest
    needs: meta
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install MSYS2 toolchain
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          path-type: inherit
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      # The Wails build runs under Git Bash, so cgo's gcc must be on PATH outside
      # the MSYS2 shell as well.
      - name: Add UCRT64 gcc to PATH
        shell: pwsh
        run: |
          $candidates = @(
            "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin",
            "C:\msys64\ucrt64\bin"
          ) | Where-Object { $_ -and (Test-Path (Join-Path $_ "gcc.exe")) }
          if (-not $candidates) { throw "gcc.exe not found in any candidate MSYS2 UCRT64 location" }
          Add-Content -Path $env:GITHUB_PATH -Value $candidates[0]
          Write-Host "added $($candidates[0]) to PATH"

      # Git Bash cannot append to the Windows-style GITHUB_PATH command file,
      # so the PATH update happens in PowerShell on Windows (see docs/CI.md).
      - name: Install Wails CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $wailsVersion = (go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go install "github.com/wailsapp/wails/v2/cmd/wails@$wailsVersion"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -Path $env:GITHUB_PATH -Value "$(go env GOPATH)\bin"

      - name: Build native library
        shell: msys2 {0}
        run: |
          cmake -S native -B native/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCHRONOS_BUILD_TESTS=OFF
          cmake --build native/build

      # Bindings generation compiles+runs a helper linked to chronos.dll.
      - name: Add native library dir to PATH
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "$env:GITHUB_WORKSPACE\native\build"

      - name: Frontend dependencies
        shell: bash
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: wails build
        shell: bash
        run: |
          set -euo pipefail
          wails build -clean -tags "chronos_native" -platform windows/amd64 \
            -ldflags "-X main.version=${VERSION}"

      - name: Build browser-mode CLI
        shell: bash
        run: |
          set -euo pipefail
          CGO_ENABLED=1 go build -tags chronos_native -o build/bin/chronos-cli.exe ./cmd/chronos
          ls -l build/bin/chronos-cli.exe

      - name: Fetch ONNX Runtime CPU runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ortVersion = "1.24.4"
          $ortDir = Join-Path $env:RUNNER_TEMP "ort-win"
          $zip = Join-Path $env:RUNNER_TEMP "ort-win.zip"
          Invoke-WebRequest -UseBasicParsing -Uri `
            "https://github.com/microsoft/onnxruntime/releases/download/v$ortVersion/onnxruntime-win-x64-$ortVersion.zip" `
            -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $ortDir -Force
          $dll = Get-ChildItem -Path $ortDir -Filter onnxruntime.dll -Recurse | Select-Object -First 1
          if (-not $dll) { throw "onnxruntime.dll not found in the ORT archive" }
          Add-Content -Path $env:GITHUB_ENV -Value "ORT_DLL=$($dll.FullName)"

      - name: Package .zip
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stage = "dist-packages\chronos-$env:VERSION-windows-amd64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $exe = Get-ChildItem -Path build/bin -Filter chronos.exe -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $exe) {
            $exe = Get-ChildItem -Path build/bin -Filter *.exe -ErrorAction SilentlyContinue |
              Sort-Object Length -Descending | Select-Object -First 1
          }
          if (-not $exe) { throw "wails output not found under build/bin" }
          Copy-Item $exe.FullName (Join-Path $stage "chronos.exe")
          # Browser mode fallback: headless CLI + double-click launcher + web UI.
          Copy-Item build/bin/chronos-cli.exe $stage
          Set-Content -Path (Join-Path $stage "chronos-web.cmd") -Encoding ascii -Value @(
            "@echo off",
            "setlocal",
            'cd /d "%~dp0"',
            '"%~dp0chronos-cli.exe" serve --open %*'
          )
          if (-not (Test-Path -Path "frontend/dist/index.html")) {
            throw "frontend/dist/index.html missing; the frontend build must run before packaging"
          }
          New-Item -ItemType Directory -Force -Path (Join-Path $stage "web") | Out-Null
          Copy-Item -Path "frontend/dist/*" -Destination (Join-Path $stage "web") -Recurse -Force
          Copy-Item native/build/chronos.dll $stage
          # ONNX Runtime (dynamic loading) lives in <exeDir>\ort\onnxruntime.dll.
          New-Item -ItemType Directory -Force -Path (Join-Path $stage "ort") | Out-Null
          Copy-Item $env:ORT_DLL (Join-Path $stage "ort")
          $ortRoot = Split-Path $env:ORT_DLL -Parent
          $shared = Get-ChildItem -Path $ortRoot -Filter onnxruntime_providers_shared.dll -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if ($shared) { Copy-Item $shared.FullName (Join-Path $stage "ort") }
          New-Item -ItemType Directory -Force -Path (Join-Path $stage "models") | Out-Null
          Copy-Item internal/models/registry.json (Join-Path $stage "models")
          foreach ($f in @("README.md", "LICENSE")) {
            if (Test-Path $f) { Copy-Item $f $stage }
          }
          Compress-Archive -Path (Join-Path $stage "*") `
            -DestinationPath "dist-packages\chronos-$env:VERSION-windows-amd64.zip" -Force

      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist-packages
          sha256sum ./*.zip > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: chronos-windows
          path: dist-packages/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: publish GitHub Release
    runs-on: ubuntu-latest
    needs: [meta, build-linux, build-windows]
    steps:
      - name: Download linux packages
        uses: actions/download-artifact@v4
        with:
          name: chronos-linux
          path: dist

      - name: Download windows packages
        uses: actions/download-artifact@v4
        with:
          name: chronos-windows
          path: dist

      - name: Verify expected assets
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          expected=(
            "dist/chronos_${VERSION}_amd64.deb"
            "dist/chronos-${VERSION}-linux-amd64.tar.gz"
            "dist/chronos-${VERSION}-linux-amd64-web.tar.gz"
            "dist/chronos-${VERSION}-windows-amd64.zip"
          )
          for f in "${expected[@]}"; do
            test -f "$f" || { echo "::error::missing release asset: $f"; ls -l dist; exit 1; }
            echo "found $f"
          done

      - name: Build combined SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          rm -f SHA256SUMS
          sha256sum ./*.deb ./*.tar.gz ./*.zip > SHA256SUMS
          echo "--- release assets ---"
          ls -lh
          cat SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: Chronos ${{ needs.meta.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(needs.meta.outputs.version, '-') }}
          files: |
            dist/*.deb
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
