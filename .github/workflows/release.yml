# Project Chronos - release pipeline.
#
# Triggers:
#   * push of a tag matching v*  (e.g. git tag v0.2.0 && git push origin v0.2.0)
#   * workflow_dispatch with an explicit version input (no tag required)
#
# Both desktop bundles are built from source, checksummed, and attached to the
# GitHub Release: chronos-<ver>-linux-amd64.deb, .tar.gz and
# chronos-<ver>-windows-amd64.zip plus SHA256SUMS.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (e.g. 0.1.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CGO_ENABLED: "1"

jobs:
  meta:
    name: resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve version from tag or dispatch input
        id: resolve
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION}" ]; then
            VERSION="${INPUT_VERSION#v}"
          else
            VERSION="${REF_NAME#v}"
          fi
          VERSION="$(printf '%s' "${VERSION}" | tr -d '[:space:]')"
          if [ -z "${VERSION}" ]; then
            echo "::error::Could not resolve a version (empty tag/input)."
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Releasing Chronos ${VERSION}"

  build-linux:
    name: build-linux (wails + .deb + .tar.gz)
    runs-on: ubuntu-latest
    needs: meta
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      LD_LIBRARY_PATH: native/build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ pkg-config \
            libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"

      - name: Build native library
        shell: bash
        run: |
          set -euo pipefail
          cmake -S native -B native/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCHRONOS_BUILD_TESTS=OFF
          cmake --build native/build --parallel

      - name: Frontend dependencies
        shell: bash
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: wails build
        shell: bash
        run: |
          set -euo pipefail
          wails build -clean -tags "webkit2_41 chronos_native" \
            -ldflags "-X main.version=${VERSION}"

      - name: Package .deb + .tar.gz
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-packages
          VERSION="${VERSION}" OUT_DIR=dist-packages bash scripts/package-linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: chronos-linux
          path: dist-packages/*
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: build-windows (wails + .zip)
    runs-on: windows-latest
    needs: meta
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install MSYS2 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          path-type: inherit
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Install Wails CLI
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"

      - name: Build native library
        shell: msys2 {0}
        run: |
          cmake -S native -B native/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCHRONOS_BUILD_TESTS=OFF
          cmake --build native/build

      - name: Frontend dependencies
        shell: bash
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: wails build
        shell: bash
        run: |
          set -euo pipefail
          wails build -clean -tags "chronos_native" -platform windows/amd64 \
            -ldflags "-X main.version=${VERSION}"

      - name: Package .zip
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stage = "dist-packages\chronos-$env:VERSION-windows-amd64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $exe = Get-ChildItem -Path build/bin -Filter *.exe -ErrorAction SilentlyContinue |
            Sort-Object Length -Descending | Select-Object -First 1
          if (-not $exe) { throw "wails output not found under build/bin" }
          Copy-Item $exe.FullName (Join-Path $stage "chronos.exe")
          Copy-Item native/build/chronos.dll $stage
          New-Item -ItemType Directory -Force -Path (Join-Path $stage "models") | Out-Null
          Copy-Item internal/models/registry.json (Join-Path $stage "models")
          foreach ($f in @("README.md", "LICENSE")) {
            if (Test-Path $f) { Copy-Item $f $stage }
          }
          Compress-Archive -Path (Join-Path $stage "*") `
            -DestinationPath "dist-packages\chronos-$env:VERSION-windows-amd64.zip" -Force

      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist-packages
          sha256sum ./*.zip > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: chronos-windows
          path: dist-packages/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: publish GitHub Release
    runs-on: ubuntu-latest
    needs: [meta, build-linux, build-windows]
    steps:
      - name: Download linux packages
        uses: actions/download-artifact@v8
        with:
          name: chronos-linux
          path: dist

      - name: Download windows packages
        uses: actions/download-artifact@v8
        with:
          name: chronos-windows
          path: dist

      - name: Build combined SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          rm -f SHA256SUMS
          sha256sum ./*.deb ./*.tar.gz ./*.zip > SHA256SUMS
          echo "--- release assets ---"
          ls -lh
          cat SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: Chronos ${{ needs.meta.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(needs.meta.outputs.version, '-') }}
          files: |
            dist/*.deb
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
