# Project Chronos - dependency update automation.
#
# Weekly, grouped by ecosystem. Native third-party C/C++ code is vendored
# (native/third_party) and updated manually via the upstream stb releases.
#
# Major bumps are ignored on purpose: the stack is pinned for reproducibility
# (Wails 2.x ABI, Tailwind 3.x config, pnpm 11 lockfile) and a major upgrade
# requires a manual PR that re-runs the full native + desktop matrix.

version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels: ["dependencies", "go"]
    commit-message:
      prefix: "deps(go)"
    groups:
      go-deps:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels: ["dependencies", "frontend"]
    commit-message:
      prefix: "deps(frontend)"
    versioning-strategy: increase
    groups:
      frontend-deps:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "deps(actions)"
    groups:
      actions:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
