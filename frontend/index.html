<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 主题由 data-theme 决定；这里声明两种 color-scheme，运行时由 theme.ts 收窄 -->
    <meta name="color-scheme" content="dark light" />
    <title>Chronos 超分工作站</title>
    <script>
      // 首帧前恢复主题，避免浅色 / Claude 主题先闪一帧深色。
      // 与 src/lib/theme.ts 的 THEME_STORAGE_KEY / DEFAULT_THEME 保持一致。
      ;(function () {
        try {
          var theme = window.localStorage.getItem('chronos.theme')
          if (theme !== 'light' && theme !== 'claude' && theme !== 'dark') theme = 'dark'
          var root = document.documentElement
          root.setAttribute('data-theme', theme)
          root.style.setProperty('color-scheme', theme === 'dark' ? 'dark' : 'light')
        } catch (error) {
          /* localStorage 不可用：保留 style.css 中 :root 的深色默认 */
        }
      })()
    </script>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a0f15'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%2322c8bd' stroke-width='2.5'/%3E%3Cpath d='M16 10v6l4 3' fill='none' stroke='%236cebdb' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E"
    />
  </head>
  <body class="h-full">
    <div id="app" class="h-full"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
